# Run Tools/check and package every target on each push and pull request, with
# desert-ant-core checked out beside the CLI at the ref CORE_REF names, then hand the
# tarballs to verify.yml, which installs them into clean systems and runs Tools/smoke.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  darwin:
    name: darwin-arm64
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          path: desert-ant-cli
      - name: Core ref
        id: core
        run: echo "ref=$(desert-ant-cli/Tools/core-ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: Desert-Ant-Labs/desert-ant-core
          ref: ${{ steps.core.outputs.ref }}
          path: desert-ant-core
      - name: Check
        working-directory: desert-ant-cli
        run: Tools/check
      - name: Package
        working-directory: desert-ant-cli
        run: Tools/package darwin-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-arm64
          path: desert-ant-cli/dist/*.tar.gz

  # Tools/linux builds the image from Tools/linux.Dockerfile and runs each step in it,
  # the same way on a laptop, here, and in the release.
  linux:
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
        with:
          path: desert-ant-cli
      - name: Core ref
        id: core
        run: echo "ref=$(desert-ant-cli/Tools/core-ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: Desert-Ant-Labs/desert-ant-core
          ref: ${{ steps.core.outputs.ref }}
          path: desert-ant-core
      - name: Check
        working-directory: desert-ant-cli
        run: Tools/linux Tools/check
      - name: Package
        working-directory: desert-ant-cli
        run: Tools/linux Tools/package linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: desert-ant-cli/dist/*.tar.gz

  verify:
    needs: [darwin, linux]
    uses: ./.github/workflows/verify.yml
