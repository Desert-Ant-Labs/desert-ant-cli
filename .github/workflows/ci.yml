# Run Tools/check and package every target on each push and pull request, with
# desert-ant-core checked out beside the CLI at the ref CORE_REF names, then hand the
# tarballs to verify.yml, which installs them into clean systems and runs Tools/smoke.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  darwin:
    name: darwin-arm64
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          path: desert-ant-cli
      - name: Core ref
        id: core
        run: echo "ref=$(desert-ant-cli/Tools/core-ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: Desert-Ant-Labs/desert-ant-core
          ref: ${{ steps.core.outputs.ref }}
          path: desert-ant-core
      - name: Check
        working-directory: desert-ant-cli
        run: Tools/check
      - name: Package
        working-directory: desert-ant-cli
        run: Tools/package darwin-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: darwin-arm64
          path: desert-ant-cli/dist/*.tar.gz

  # The Swift image the release builds in, so CI tests the same binary a release ships.
  # Core's dal.sh vendors LiteRT with uv.
  linux:
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    container: swift:6.2-jammy
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-22.04 }
          - { arch: arm64, runner: ubuntu-22.04-arm }
    steps:
      - name: Build dependencies
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git curl ca-certificates python3 binutils ffmpeg \
            libcurl4-openssl-dev libxml2-dev zlib1g-dev
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@v4
        with:
          path: desert-ant-cli
      - name: Core ref
        id: core
        run: echo "ref=$(desert-ant-cli/Tools/core-ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: Desert-Ant-Labs/desert-ant-core
          ref: ${{ steps.core.outputs.ref }}
          path: desert-ant-core
      - name: Check
        working-directory: desert-ant-cli
        run: Tools/check
      - name: Package
        working-directory: desert-ant-cli
        run: Tools/package linux-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: desert-ant-cli/dist/*.tar.gz

  verify:
    needs: [darwin, linux]
    uses: ./.github/workflows/verify.yml
