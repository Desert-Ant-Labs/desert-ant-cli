# Install the packaged archives from the calling run the way a person would, and run
# Tools/smoke against them: on Linux in clean images of the common distributions
# (Tools/linux-matrix), on macOS from the extracted tarball, and on Windows with
# install.ps1 on a runner with no Swift toolchain, so a DLL the zip lacks fails here.
# ci.yml and release.yml both call this, so a pull request and a release pass the same
# checks.
name: verify

on:
  workflow_call:

jobs:
  linux:
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/models
          key: models-linux-${{ matrix.arch }}-${{ hashFiles('manifest.json') }}
          restore-keys: models-linux-${{ matrix.arch }}-
      - name: Distributions, without ffmpeg
        env:
          DESERTANT_MODELS_DIR: ${{ runner.temp }}/models
        run: Tools/linux-matrix --arch ${{ matrix.arch }}
      - name: Distributions, with ffmpeg
        env:
          DESERTANT_MODELS_DIR: ${{ runner.temp }}/models
        run: Tools/linux-matrix --arch ${{ matrix.arch }} --ffmpeg ubuntu:24.04 debian:12 fedora:42

  darwin:
    name: darwin-arm64
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: darwin-arm64
          path: dist
      - name: ffmpeg
        run: brew install ffmpeg
      - name: Smoke
        run: |
          mkdir -p "$RUNNER_TEMP/da"
          tar -xzf dist/desertant-darwin-arm64.tar.gz -C "$RUNNER_TEMP/da"
          Tools/smoke "$RUNNER_TEMP/da/desertant"

  windows:
    name: windows-x86_64
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-x86_64
          path: dist
      - name: Install
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 dist\desertant-windows-x86_64.zip).Hash.ToLower()
          "$hash  desertant-windows-x86_64.zip" | Set-Content dist\checksums.txt
          $env:DESERTANT_HOME = "$env:RUNNER_TEMP\da"
          $env:DESERTANT_BASE_URL = "file:///$($PWD.Path -replace '\\', '/')/dist"
          ./install.ps1
      # Core keeps models where Foundation puts caches, which doctor reports.
      - name: Model cache
        id: models
        run: echo "path=$("$RUNNER_TEMP/da/desertant.exe" doctor --json | jq -r .cachePath)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.models.outputs.path }}
          key: models-windows-x86_64-${{ hashFiles('manifest.json') }}
          restore-keys: models-windows-x86_64-
      - name: Smoke, without ffmpeg
        run: Tools/smoke "$RUNNER_TEMP/da/desertant.exe"
      - name: ffmpeg
        run: choco install ffmpeg --no-progress -y
      - name: Smoke, with ffmpeg
        run: |
          export PATH="/c/ProgramData/chocolatey/bin:$PATH"
          Tools/smoke "$RUNNER_TEMP/da/desertant.exe"
