flow: 1
title: Sort photos by kind
summary: A folder for each kind of photo.
steps:
  - id: in
    type: photos
  - id: eye
    type: eye
    uses:
      image: in.photos
  - id: copy
    type: copy
    uses:
      files: in.photos
      a: eye.type
    with:
      mode: copy
      subfolder: "{{a}}"
  - id: hint
    type: note
    with:
      text: Pass --apply to copy.
